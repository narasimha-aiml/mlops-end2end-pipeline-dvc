name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [ main ]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if the CI Pipeline that triggered this actually passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Check Docker Hub credentials
      id: docker_creds
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        if [ -n "$DOCKER_USERNAME" ]; then
          echo "has_creds=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_creds=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: steps.docker_creds.outputs.has_creds == 'true'

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ steps.docker_creds.outputs.has_creds == 'true' }}
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/cats-dogs-classifier:latest
          ${{ secrets.DOCKER_USERNAME }}/cats-dogs-classifier:${{ github.event.workflow_run.head_sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      if: steps.docker_creds.outputs.has_creds == 'true'

    - name: Build Docker image (local only)
      run: docker build -t cats-dogs-classifier:latest .
      if: steps.docker_creds.outputs.has_creds == 'false'

    - name: Deploy with Docker Compose
      run: |
        docker-compose -f deployment/docker-compose/docker-compose.yml pull || true
        docker-compose -f deployment/docker-compose/docker-compose.yml down || true
        docker-compose -f deployment/docker-compose/docker-compose.yml up -d --build

    - name: Wait for service to be ready
      run: bash scripts/wait_for_service.sh

    - name: Run smoke tests
      run: bash scripts/smoke_tests.sh

    - name: Show container logs on failure
      if: failure()
      run: docker-compose -f deployment/docker-compose/docker-compose.yml logs

    - name: Tear down
      if: always()
      run: docker-compose -f deployment/docker-compose/docker-compose.yml down || true