version: '3.8'

services:
  cats-dogs-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: cats-dogs-classifier
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/cats_dogs_model.h5
      - PYTHONUNBUFFERED=1
    volumes:
      - ./../../models:/app/models:ro
      - ./../../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
